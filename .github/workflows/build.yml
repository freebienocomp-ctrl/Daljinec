name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle testDebugUnitTest assembleDebug --no-daemon -Pandroid.useAndroidX=true -Dorg.gradle.jvmargs=-Xmx3g
      - uses: actions/upload-artifact@v4
        with:
          name: daljinec-apk
          path: build/outputs/apk/debug/*.apk
      # Objavi APK kot Release, da je vedno na isti povezavi:
      # https://github.com/freebienocomp-ctrl/Daljinec/releases/latest/download/PocketRemote.apk
      - name: Objavi APK
        env:
          GH_TOKEN: ${{ github.token }}
          MSG: ${{ github.event.head_commit.message }}
          N: ${{ github.run_number }}
        run: |
          cp build/outputs/apk/debug/*.apk PocketRemote.apk
          gh release create "build-$N" PocketRemote.apk \
            --title "Pocket Remote, gradnja $N" \
            --notes "${MSG:-Ročna gradnja}" \
            --latest
